name: Build packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests
      - run: python -m compileall -q src
      - uses: actions/upload-artifact@v4
        with:
          name: e2pvr-packages
          path: dist/*0.2.3_all.*
